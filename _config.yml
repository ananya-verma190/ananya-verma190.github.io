title: Ananya Verma
lang: en
permalink: /blog/:title/

kramdown:
  input: GFM
  hard_wrap: true

collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
